<!DOCTYPE html>
<html lang="en" data-theme="light" data-role="STUDENT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CampusHub — Campus Intelligence & Desktop Admin Workspace</title>
  
  <meta name="description" content="Mobile-First Campus Intelligence, Timetable Planner, Attendance Tracker, Marketplace & Desktop Admin Workspace">
  <meta name="theme-color" content="#F7F7F5">
  <link rel="manifest" href="/manifest.json">

  <!-- Apple Touch Icons & Web App Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CampusHub">

  <!-- Zero-FOUC Synchronous Theme & Role Initializer -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('campushub-theme');
        var theme = (savedTheme === 'dark' || savedTheme === 'light') 
          ? savedTheme 
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        
        var savedRole = localStorage.getItem('campushub-role') || 'STUDENT';
        document.documentElement.setAttribute('data-role', savedRole);
      } catch (e) {
        console.warn('Initial theme/role hydration failed', e);
      }
    })();
  </script>

  <!-- Unified Apple x Notion Production Stylesheet -->
  <link rel="stylesheet" href="/css/styles.css">
  
  <!-- ES Module Application Entrypoint -->
  <script type="module" src="/js/app.js"></script>
</head>
<body>

  <!-- Ambient Cursor Glow Container -->
  <div id="cursor-glow" aria-hidden="true"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Glassmorphic Top Header -->
  <header class="app-header">
    <div class="header-brand" id="brand-home-btn" role="button" tabindex="0" aria-label="CampusHub Home">
      <span class="brand-logo" role="img" aria-label="CampusHub Graduation Cap">🎓</span>
      <h1 class="header-title">CampusHub</h1>
    </div>

    <!-- Desktop Navigation Bar (Shown on tablet and desktop screens) -->
    <nav class="desktop-nav" id="desktop-nav" aria-label="Desktop Navigation" role="tablist">
      <button type="button" class="nav-tab active" data-view="home" role="tab" aria-selected="true">
        <span class="nav-icon">🏠</span> <span>Home</span>
      </button>
      <button type="button" class="nav-tab" data-view="planner" role="tab" aria-selected="false">
        <span class="nav-icon">📅</span> <span>Planner</span>
      </button>
      <button type="button" class="nav-tab" data-view="market" role="tab" aria-selected="false">
        <span class="nav-icon">🛍️</span> <span>Market</span>
      </button>
      <button type="button" class="nav-tab" data-view="lost" role="tab" aria-selected="false">
        <span class="nav-icon">🔍</span> <span>Lost & Found</span>
      </button>
      <button type="button" class="nav-tab admin-nav-tab" data-view="admin" id="desktop-nav-admin" role="tab" aria-selected="false" style="display: none;">
        <span class="nav-icon">⚙️</span> <span>Admin Workspace</span>
      </button>
    </nav>
    
    <div class="header-actions">
      <!-- Interactive User Profile Badge with Role Switcher -->
      <div class="user-badge" id="user-profile-badge" title="Click to toggle between STUDENT and ADMIN mode" role="button" tabindex="0" aria-label="Toggle role between Student and Admin">
        <img id="user-avatar" class="avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=John" alt="User Avatar">
        <span id="user-name" class="user-name">John Doe</span>
        <span id="user-role" class="role-pill" data-role="STUDENT">
          STUDENT <span class="role-switch-icon" aria-hidden="true">⇄</span>
        </span>
      </div>

      <!-- One-Tap Theme Toggle Icon -->
      <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle dark/light theme" type="button">🌙</button>
    </div>
  </header>

  <!-- Main View Container (Distraction-free 1100px desktop shell) -->
  <main class="container" id="main-container">

    <!-- 1. HOME VIEW SECTION -->
    <section id="home-view" class="view-section active" role="tabpanel" aria-labelledby="tab-home">
      <!-- Mounted via views/home.js -->
    </section>

    <!-- 2. PLANNER VIEW SECTION -->
    <section id="planner-view" class="view-section" role="tabpanel" aria-labelledby="tab-planner">
      <!-- Mounted via views/planner.js -->
    </section>

    <!-- 3. MARKETPLACE VIEW SECTION -->
    <section id="market-view" class="view-section" role="tabpanel" aria-labelledby="tab-market">
      <!-- Mounted via views/market.js -->
    </section>

    <!-- 4. LOST & FOUND VIEW SECTION -->
    <section id="lost-view" class="view-section" role="tabpanel" aria-labelledby="tab-lost">
      <!-- Mounted via views/lostfound.js -->
    </section>

    <!-- 5. DESKTOP ADMIN WORKSPACE SECTION (Multi-column, dense tables & split panel) -->
    <section id="admin-view" class="view-section" role="tabpanel" aria-labelledby="tab-admin">
      <!-- Mounted via views/admin.js -->
    </section>

  </main>

  <!-- Mobile Fixed Bottom Glassmorphic Dock Navigation (Hidden in Desktop Admin Workspace) -->
  <nav class="bottom-dock" id="bottom-dock" aria-label="Bottom Navigation Dock" role="tablist">
    <button type="button" class="dock-item active" id="tab-home" data-view="home" role="tab" aria-selected="true" aria-label="Home Overview">
      <span class="dock-icon">🏠</span>
      <span>Home</span>
    </button>
    <button type="button" class="dock-item" id="tab-planner" data-view="planner" role="tab" aria-selected="false" aria-label="Timetable & Attendance Planner">
      <span class="dock-icon">📅</span>
      <span>Planner</span>
    </button>
    <button type="button" class="dock-item" id="tab-market" data-view="market" role="tab" aria-selected="false" aria-label="Campus Marketplace">
      <span class="dock-icon">🛍️</span>
      <span>Market</span>
    </button>
    <button type="button" class="dock-item" id="tab-lost" data-view="lost" role="tab" aria-selected="false" aria-label="Lost and Found">
      <span class="dock-icon">🔍</span>
      <span>Lost</span>
    </button>
    <button type="button" class="dock-item" id="tab-admin" data-view="admin" role="tab" aria-selected="false" aria-label="Admin Workspace" style="display: none;">
      <span class="dock-icon">⚙️</span>
      <span>Admin</span>
    </button>
  </nav>

  <!-- Marketplace Item Details Popup (Center-Aligned Viewport Modal) -->
  <div id="market-detail-modal" class="item-details-backdrop" role="dialog" aria-modal="true" aria-labelledby="detail-modal-title" aria-describedby="detail-modal-desc">
    <div class="item-details-modal">
      <!-- Visible Top-Right Close Button -->
      <button type="button" class="item-details-close" id="close-detail-modal-btn" aria-label="Close item details">✕</button>

      <!-- Left Column: Large Product Image with Aspect-Ratio & Neutral Background -->
      <div class="item-details-media" id="detail-media-container">
        <img id="detail-image" class="item-details-image" src="" alt="Product image" loading="eager">
        <div id="detail-placeholder" class="item-details-placeholder" style="display: none;">
          <span class="item-details-placeholder-icon" aria-hidden="true">🛍️</span>
          <span>No image available</span>
        </div>
      </div>

      <!-- Right Column: Item Information -->
      <div class="item-details-content">
        <div class="item-details-header">
          <div class="item-details-badges">
            <span class="role-pill" id="detail-category-badge">Category</span>
            <span class="status-pill safe" id="detail-status-badge">AVAILABLE</span>
          </div>
          <h3 id="detail-modal-title" class="item-details-title"></h3>
          <div id="detail-price" class="item-details-price">$0.00</div>
        </div>

        <div class="item-details-desc-box">
          <span class="item-details-desc-label">Item Description</span>
          <p id="detail-modal-desc" class="item-details-desc"></p>
        </div>

        <!-- Dynamic Metadata Grid -->
        <div class="item-details-meta" id="detail-meta-container"></div>

        <!-- Senior Student Seller Contact Information Section -->
        <section class="seller-contact-section" id="seller-contact-section" aria-label="Seller Contact Information">
          <div class="seller-contact-header">
            <span class="item-details-desc-label">Seller Contact Information</span>
            <span class="seller-badge" id="seller-status-badge">🎓 Senior Student</span>
          </div>
          <div id="seller-contact-card" class="seller-contact-card"></div>
          <div id="seller-contact-actions" class="seller-contact-actions"></div>
        </section>

        <div class="item-details-footer">
          <button type="button" class="btn btn-secondary" id="dismiss-detail-btn">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Lost & Found Item Details Popup (Center-Aligned Viewport Modal) -->
  <div id="lost-detail-modal" class="item-details-backdrop" role="dialog" aria-modal="true" aria-labelledby="lost-detail-title" aria-describedby="lost-detail-desc">
    <div class="item-details-modal">
      <!-- Visible Top-Right Close Button -->
      <button type="button" class="item-details-close" id="close-lost-detail-btn" aria-label="Close report details">✕</button>

      <!-- Left Column: Large Product Image with Aspect-Ratio & Neutral Background -->
      <div class="item-details-media" id="lost-detail-media-container">
        <img id="lost-detail-image" class="item-details-image" src="" alt="Report photo" loading="eager">
        <div id="lost-detail-placeholder" class="item-details-placeholder" style="display: none;">
          <span class="item-details-placeholder-icon" aria-hidden="true">🔍</span>
          <span>No photograph attached</span>
        </div>
      </div>

      <!-- Right Column: Item Information -->
      <div class="item-details-content">
        <div class="item-details-header">
          <div class="item-details-badges">
            <span id="lost-detail-type-badge" class="type-pill"></span>
            <span id="lost-detail-status-badge" class="status-pill"></span>
          </div>
          <h3 id="lost-detail-title" class="item-details-title"></h3>
          <div class="lost-detail-row" style="margin-top: 4px; font-size: 0.95rem;">
            <span>📍</span>
            <strong id="lost-detail-location" style="color: var(--text-primary);"></strong>
          </div>
        </div>

        <div class="item-details-desc-box">
          <span class="item-details-desc-label">Description & Identifiers</span>
          <p id="lost-detail-desc" class="item-details-desc"></p>
        </div>

        <!-- Dynamic Metadata Grid (Report Date, Reporter Name, Report ID) -->
        <div class="item-details-meta" id="lost-detail-meta-container"></div>

        <!-- Contact Information Section -->
        <div class="lost-contact-section" id="lost-contact-section">
          <span class="item-details-desc-label">Contact Information</span>
          <div id="lost-contact-container" class="lost-contact-list"></div>
        </div>

        <!-- Footer Actions with Claim / Resolve Button & Close -->
        <div class="item-details-footer">
          <div id="lost-detail-actions-container" style="display: flex; gap: 8px;"></div>
          <button type="button" class="btn btn-secondary" id="dismiss-lost-detail-btn">Close</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
