<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CampusHub — Campus Intelligence & PWA</title>
  
  <meta name="description" content="Mobile-First Campus Intelligence, Timetable Planner, Attendance Tracker & Marketplace">
  <meta name="theme-color" content="#F7F7F5">
  <link rel="manifest" href="/manifest.json">

  <!-- Apple Touch Icons & Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CampusHub">

  <!-- Modular Stylesheets loaded directly in dependency order -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/cards.css">
  <link rel="stylesheet" href="/css/modals.css">
  <link rel="stylesheet" href="/css/toast.css">
  <link rel="stylesheet" href="/css/dock.css">
  
  <!-- ES Module Application Entrypoint -->
  <script type="module" src="/js/app.js"></script>
</head>
<body>

  <!-- Ambient Cursor Glow Container -->
  <div id="cursor-glow" aria-hidden="true"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Glassmorphic Top Header -->
  <header class="app-header">
    <div class="header-brand">
      <span class="brand-logo" role="img" aria-label="CampusHub Graduation Cap">🎓</span>
      <h1 class="header-title">CampusHub</h1>
    </div>
    <div class="header-actions">
      <div class="user-badge" id="user-profile-badge">
        <img id="user-avatar" class="avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=John" alt="User Avatar">
        <span id="user-name">John Doe</span>
        <span id="user-role" class="role-pill">STUDENT</span>
      </div>
      <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle dark/light theme">🌙</button>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="container">

    <!-- 1. HOME VIEW SECTION -->
    <section id="home-view" class="view-section active">
      <!-- Mounted via views/home.js -->
    </section>

    <!-- 2. PLANNER VIEW SECTION -->
    <section id="planner-view" class="view-section">
      <!-- Mounted via views/planner.js -->
    </section>

    <!-- 3. MARKETPLACE VIEW SECTION -->
    <section id="market-view" class="view-section">
      <!-- Mounted via views/market.js -->
    </section>

    <!-- 4. LOST & FOUND VIEW SECTION -->
    <section id="lost-view" class="view-section">
      <!-- Mounted via views/lostfound.js -->
    </section>

  </main>

  <!-- Mobile Fixed Bottom Glassmorphic Dock Navigation -->
  <nav class="bottom-dock" aria-label="Bottom Navigation Dock">
    <button type="button" class="dock-item active" data-view="home" aria-label="Home Overview">
      <span class="dock-icon">🏠</span>
      <span>Home</span>
    </button>
    <button type="button" class="dock-item" data-view="planner" aria-label="Timetable Planner">
      <span class="dock-icon">📅</span>
      <span>Planner</span>
    </button>
    <button type="button" class="dock-item" data-view="market" aria-label="Campus Marketplace">
      <span class="dock-icon">🛍️</span>
      <span>Market</span>
    </button>
    <button type="button" class="dock-item" data-view="lost" aria-label="Lost and Found">
      <span class="dock-icon">🔍</span>
      <span>Lost</span>
    </button>
  </nav>

</body>
</html>
